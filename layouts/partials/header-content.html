
                <header id="masthead" style="background-image: linear-gradient(120deg, rgba(29, 37, 45, 1), rgba(0, 88, 124, 0.8)), url('{{ (partial "page-image.html" .).image }}');">

                    <div class="container">
                        <div class="category">{{ if .IsPage }}{{ .CurrentSection.Title | safeHTML }}{{ else if .IsHome}}{{ $.Site.Params.focus | safeHTML }}{{ else }}{{ .Site.Title | safeHTML }}{{ end }}</div>
                        <h1 class="title">{{ .Title | safeHTML }}</h1>
                        <span class="hr-minor"></span>
                        <p class="excerpt">{{ .Params.summary | default site.Home.Params.summary | default site.Params.description | safeHTML }}</p>
                    </div>
                </header>
